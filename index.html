<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pure Phase</title>
<style>
:root { color-scheme: dark; --bg: #000; --text: #fff; --muted: #888480; --warm-1: #F5A623; --warm-2: #E8593C; --warm-3: #C0392B; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,"SF Pro Text",sans-serif; }
.wrap { max-width:560px; margin:0 auto; padding:96px 28px; text-align:center; }
.bar { width:180px; height:1.5px; background:linear-gradient(90deg,var(--warm-1),var(--warm-2),var(--warm-3)); margin:0 auto 24px; }
h1 { font-weight:700; font-size:24px; letter-spacing:10px; margin:0 0 12px; }
.sub { font-size:11px; letter-spacing:4px; color:var(--muted); text-transform:lowercase; margin-bottom:48px; }
nav a { display:block; margin:18px 0; color:var(--warm-1); font-size:12px; letter-spacing:5px; text-transform:uppercase; text-decoration:none; }
nav a:hover { color:var(--warm-2); }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"></div>
  <h1>PURE PHASE</h1>
  <div class="sub">light · sound · breath</div>
  <nav>
    <a href="privacy.html">Privacy Policy</a>
    <a href="support.html">Support</a>
  </nav>
</div>
</body>
</html>
